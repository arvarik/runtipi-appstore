name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run schema tests
        run: bun test

      - name: Validate Docker Compose files
        run: |
          shopt -s nullglob
          for file in apps/*/docker-compose.yml; do
            echo "Validating $file"
            APP_DATA_DIR=/tmp/runtipi-appdata docker compose -f "$file" config -q
          done
